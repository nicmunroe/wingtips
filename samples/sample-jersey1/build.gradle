evaluationDependsOn(':')

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

ext {
    jersey1Version = '1.19.4'
}

dependencies {
    implementation(
            project(":wingtips-servlet-api"),
            "com.sun.jersey:jersey-servlet:$jersey1Version",
            "com.sun.jersey:jersey-json:$jersey1Version",
            "ch.qos.logback:logback-classic:$logbackVersion",
            "org.eclipse.jetty:jetty-webapp:$jettyVersion"
    )
    testImplementation(
            "org.junit.jupiter:junit-jupiter:$junitJupiterVersion",
            "org.mockito:mockito-core:$mockitoVersion",
            "ch.qos.logback:logback-classic:$logbackVersion",
            "org.assertj:assertj-core:$assertJVersion",
            "io.rest-assured:rest-assured:$restAssuredVersion"
    )
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:$junitPlatformVersion")
}

apply plugin: "application"
application {
    mainClass = "com.nike.wingtips.jersey1sample.Main"
}

run {
    systemProperties = System.getProperties()
}
